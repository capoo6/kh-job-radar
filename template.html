<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f4f6f9;--card:#ffffff;--ink:#1a2233;--muted:#66708a;--line:#e3e7ef;
  --brand:#1d4ed8;--brand-soft:#e8eefc;--new:#dc2626;--new-soft:#fdecec;
  --ok:#047857;--ok-soft:#e7f5f0;--warn:#b45309;--warn-soft:#fdf3e3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{background:linear-gradient(135deg,#16327d,#1d4ed8);color:#fff;padding:28px 16px 22px}
.wrap{max-width:860px;margin:0 auto}
header h1{font-size:22px;letter-spacing:1px}
header p{opacity:.85;font-size:13px;margin-top:6px}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.14);border-radius:10px;padding:8px 14px;font-size:13px}
.stat b{font-size:19px;margin-right:4px}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line)}
.tabs{width:100%;display:flex;gap:8px;margin-bottom:8px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700;cursor:pointer}
.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
.fav-btn{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:#c8cedb;padding:4px}
.fav-btn:hover{color:#f59e0b}
.fav-btn.on{color:#f59e0b}
.card{position:relative}
.card.gone{opacity:.75;border-style:dashed}
.controls .wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls input[type=search],.controls select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:var(--card);color:var(--ink)}
.controls input[type=search]{flex:1;min-width:160px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.toggle input{accent-color:var(--brand)}
#count{font-size:13px;color:var(--muted);width:100%}
.dd{position:relative}
.dd>button{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:var(--card);color:var(--ink);cursor:pointer}
.dd-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(26,34,51,.15);padding:8px;max-height:300px;overflow-y:auto;min-width:190px}
.dd-panel.open{display:block}
.dd-panel label{display:flex;align-items:center;gap:7px;font-size:13.5px;padding:5px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
.dd-panel label:hover{background:var(--bg)}
.dd-panel input{accent-color:var(--brand)}
.dd-actions{display:flex;gap:6px;padding:2px 6px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.dd-actions button{font-size:12px;border:none;background:none;color:var(--brand);cursor:pointer;padding:2px 4px}
.numf{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.numf input{width:52px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:13.5px;text-align:center;background:var(--bg);color:var(--ink)}
main{padding:14px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 14px rgba(26,34,51,.08)}
.card.new{border-left:4px solid var(--new)}
.row1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.jobname{font-size:17px;font-weight:700;color:var(--brand);text-decoration:none}
.jobname:hover{text-decoration:underline}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.b-new{background:var(--new-soft);color:var(--new)}
.b-trip{background:var(--warn-soft);color:var(--warn)}
.b-remote{background:var(--brand-soft);color:var(--brand)}
.company{font-size:14px;margin-top:3px}
.company a{color:var(--ink);text-decoration:none}
.company a:hover{text-decoration:underline}
.company .ind{color:var(--muted);font-size:12.5px}
.salary{font-weight:700;margin-top:6px;font-size:15px}
.salary.salary{color:var(--ok)}
.salary.negotiable{color:var(--warn)}
.traffic{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:13px;color:var(--ink);align-items:center}
.traffic a{color:var(--brand);text-decoration:none;font-size:12.5px}
.traffic a:hover{text-decoration:underline}
.b-direct{background:var(--new-soft);color:#b91c1c}
.b-li{background:#e7f0fe;color:#0a66c2}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.chip.lang{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.vio{background:var(--new-soft);color:var(--new);border-color:transparent;font-weight:700;cursor:pointer}
.vio-d{display:inline-block}
.vio-d summary{list-style:none}
.vio-d summary::-webkit-details-marker{display:none}
.vio-list{margin:6px 0 2px;padding:8px 10px;background:var(--new-soft);border-radius:8px;font-size:12.5px;color:var(--ink);list-style:none;max-width:640px}
.vio-list li{padding:3px 0;border-bottom:1px dashed rgba(220,38,38,.2)}
.vio-list li:last-child{border-bottom:none}
.vio-list b{color:var(--new);font-weight:700;margin-right:4px}
.desc{font-size:13px;color:var(--muted);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;gap:6px}
.apply-btn{background:var(--brand);color:#fff;text-decoration:none;font-size:13px;font-weight:700;border-radius:8px;padding:6px 14px}
.apply-btn:hover{background:#173db0}
.empty{text-align:center;color:var(--muted);padding:60px 0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 40px}
@media (max-width:520px){header h1{font-size:19px}.stat b{font-size:16px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>__TITLE__</h1>
    <p>資料來源:104 人力銀行|每日自動更新|最後更新 __UPDATED__</p>
    <p>📍 距離以「捷運巨蛋站」為出發點;「尖峰」與大眾運輸時間 = 週一早上 7:30 出發的 Google 路況估計</p>
    <p>更多來源:<a style="color:#cdd9f7" href="https://www.cake.me/jobs?q=%E5%9C%8B%E5%A4%96%E6%A5%AD%E5%8B%99&location_list%5B0%5D=Kaohsiung%20City%2C%20Taiwan" target="_blank" rel="noopener">在 Cake 搜尋高雄國外業務 →</a></p>
    <div class="stats">
      <div class="stat"><b id="st-total">0</b>筆追蹤中</div>
      <div class="stat"><b id="st-new">0</b>筆今日新增</div>
      <div class="stat"><b id="st-salary">0</b>筆有寫明薪資</div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-view="all" type="button">全部職缺</button>
      <button class="tab" data-view="fav" type="button">⭐ 我的最愛 (<span id="fav-count">0</span>)</button>
    </div>
    <input id="q" type="search" placeholder="搜尋職稱、公司、工作內容…">
    <div class="dd">
      <button id="dist-btn" type="button">地區:全部 ▾</button>
      <div class="dd-panel" id="dist-panel">
        <div class="dd-actions"><button type="button" id="dist-all">全選</button><button type="button" id="dist-none">清除</button></div>
      </div>
    </div>
    <select id="sort">
      <option value="dist">外商/科技優先・近→遠</option>
      <option value="date">最新刊登</option>
      <option value="salary">薪資高→低</option>
      <option value="apply">應徵人數少→多</option>
    </select>
    <label class="toggle"><input id="only-new" type="checkbox">只看新增</label>
    <label class="toggle"><input id="show-neg" type="checkbox" checked>顯示面議</label>
    <label class="numf">🚗 開車≤<input id="f-drive" type="number" min="1" placeholder="--">分</label>
    <label class="numf">🚌 大眾運輸≤<input id="f-transit" type="number" min="1" placeholder="--">分</label>
    <label class="numf">💰 月薪≥<input id="f-salary" type="number" min="0" step="0.5" placeholder="--">萬</label>
    <span id="count"></span>
  </div>
</div>

<main><div class="wrap" id="list"></div></main>
<footer>此頁面為個人求職輔助工具,職缺內容以 104 原始頁面為準。</footer>

<script>
const JOBS = __DATA__;

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 我的最愛(存在瀏覽器本機)
let VIEW = "all";
let FAVS = {};
try{ FAVS = JSON.parse(localStorage.getItem("khjr_favs")) || {}; }catch(e){}
function saveFavs(){
  try{ localStorage.setItem("khjr_favs", JSON.stringify(FAVS)); }catch(e){}
  $("fav-count").textContent = Object.keys(FAVS).length;
}
function toggleFav(no){
  if(FAVS[no]) delete FAVS[no];
  else{
    const j = JOBS.find(x=>x.no===no);
    if(j) FAVS[no] = {no:j.no, name:j.name, company:j.company, url:j.url,
                      salary:j.salary, area:j.area, date:j.date};
  }
  saveFavs(); render();
}
function goneCard(f){
  return `<div class="card gone">
    <button class="fav-btn on" data-no="${esc(f.no)}" title="移出最愛" type="button">★</button>
    <div class="row1" style="padding-right:30px"><span class="jobname" style="color:var(--muted)">${esc(f.name)}</span><span class="badge b-trip">可能已下架</span></div>
    <div class="company">${esc(f.company)}</div>
    <div class="row-bottom"><span>${esc(f.area)}|收藏時:${esc(f.salary)}|刊登 ${esc(f.date)}</span>
    <a class="apply-btn" href="${esc(f.url)}" target="_blank" rel="noopener">原連結 →</a></div>
  </div>`;
}

// 統計與地區選單
$("st-total").textContent = JOBS.length;
$("st-new").textContent = JOBS.filter(j=>j.is_new).length;
$("st-salary").textContent = JOBS.filter(j=>j.salary_class==="salary").length;
// 地區多選下拉
const DISTRICTS = [...new Set(JOBS.map(j=>j.area))].sort();
const selDist = new Set();
DISTRICTS.forEach(d=>{
  const l=document.createElement("label");
  l.innerHTML=`<input type="checkbox" value="${esc(d)}"> ${esc(d)}<span style="color:var(--muted);margin-left:auto">${JOBS.filter(j=>j.area===d).length}</span>`;
  $("dist-panel").appendChild(l);
});
function distLabel(){
  $("dist-btn").textContent = selDist.size===0 ? "地區:全部 ▾"
    : selDist.size<=2 ? "地區:"+[...selDist].map(d=>d.replace("高雄市","")).join("、")+" ▾"
    : `地區:已選 ${selDist.size} 區 ▾`;
}
$("dist-btn").addEventListener("click", e=>{e.stopPropagation(); $("dist-panel").classList.toggle("open");});
$("dist-panel").addEventListener("click", e=>e.stopPropagation());
document.addEventListener("click", ()=>$("dist-panel").classList.remove("open"));
$("dist-panel").addEventListener("change", e=>{
  if(e.target.type!=="checkbox") return;
  e.target.checked ? selDist.add(e.target.value) : selDist.delete(e.target.value);
  distLabel(); render();
});
$("dist-all").addEventListener("click", ()=>{
  selDist.clear(); DISTRICTS.forEach(d=>selDist.add(d));
  $("dist-panel").querySelectorAll("input").forEach(c=>c.checked=true);
  distLabel(); render();
});
$("dist-none").addEventListener("click", ()=>{
  selDist.clear();
  $("dist-panel").querySelectorAll("input").forEach(c=>c.checked=false);
  distLabel(); render();
});

function relDate(d){
  const today = JOBS.reduce((m,j)=>j.date>m?j.date:m,"");
  if(d===today) return "今天";
  const diff = Math.round((new Date(today)-new Date(d))/86400000);
  return diff===1 ? "昨天" : d.slice(5).replace("-","/");
}

function card(j){
  const badges = [
    j.is_new ? '<span class="badge b-new">NEW</span>' : "",
    j.source==="li" ? '<span class="badge b-li">🌐 LinkedIn 外商</span>' : "",
    (j.near_line==="紅線" && j.walk_m<=1000) ? '<span class="badge b-direct">紅線直達</span>' : "",
    j.trip ? '<span class="badge b-trip">出差/外派</span>' : "",
    j.remote ? '<span class="badge b-remote">可遠端</span>' : "",
    j.repost>=2 ? `<span class="badge b-trip" title="同一職缺換編號重新刊登,可能是長期都在徵的缺">♻️ 重複刊登${j.repost}次</span>` : "",
  ].join("");
  const traffic = [];
  const approx = j.approx ? "(依公司名定位)" : "";
  if(j.drive_km!=null) traffic.push(`🚗 開車 ${j.drive_km} km・${j.peak?"尖峰約":"約"} ${j.drive_min} 分${approx}`);
  else if(j.dist_km!=null) traffic.push(`📍 直線約 ${j.dist_km} km`);
  if(j.transit_min) traffic.push(`🚌 大眾運輸約 ${j.transit_min} 分`);
  if(j.near_st) traffic.push(`🚇 近${j.near_line}「${j.near_st}」站・約 ${j.walk_m} m`);
  if(j.gmap_transit) traffic.push(
    `<a href="${esc(j.gmap_drive)}" target="_blank" rel="noopener">開車路線</a>`,
    `<a href="${esc(j.gmap_transit)}" target="_blank" rel="noopener">大眾運輸路線</a>`);
  traffic.push(
    `<a href="https://salary.tw/search?keyword=${encodeURIComponent(j.company)}" target="_blank" rel="noopener">比薪水</a>`,
    `<a href="https://interview.tw/search?keyword=${encodeURIComponent(j.company)}" target="_blank" rel="noopener">面試趣</a>`);
  const trafficRow = traffic.length ? `<div class="traffic">${traffic.join("<span style='color:var(--line)'>|</span>")}</div>` : "";
  const favBtn = `<button class="fav-btn${FAVS[j.no]?" on":""}" data-no="${esc(j.no)}" title="${FAVS[j.no]?"移出最愛":"加到最愛"}" type="button">${FAVS[j.no]?"★":"☆"}</button>`;
  const langs = j.langs.map(l=>`<span class="chip lang">${esc(l)}</span>`).join("");
  const emp = j.employees ? `<span class="chip">員工 ${j.employees} 人</span>` : "";
  const plus = j.co_plus ? "+" : "";
  const co = j.co_jobs!=null ? `<span class="chip">🏢 公司全台在徵 ${j.co_jobs}${plus} 缺・非業務職 ${j.co_other}${plus}</span>` : "";
  const vioParts = [];
  if(j.vio_lb) vioParts.push(`勞基法 ${j.vio_lb}`);
  if(j.vio_osh) vioParts.push(`職安 ${j.vio_osh}`);
  if(j.vio_oth) vioParts.push(`其他 ${j.vio_oth}`);
  const vioItems = (j.vio_items||[]).map(v=>
    `<li><b>${esc(v.date)}</b>${esc(v.law)}${v.txt?` — ${esc(v.txt)}`:""}</li>`).join("");
  const vioMore = (j.vio_lb+j.vio_osh+j.vio_oth) > (j.vio_items||[]).length
    ? `<li>…僅列最近 ${(j.vio_items||[]).length} 件,完整名單見勞動部查詢系統</li>` : "";
  const vio = vioParts.length ? `<details class="vio-d">
      <summary class="chip vio">⚠️ 近3年違規:${vioParts.join("・")} 件 ▾</summary>
      <ul class="vio-list">${vioItems}${vioMore}</ul>
    </details>` : "";
  return `<div class="card${j.is_new?" new":""}">${favBtn}
    <div class="row1" style="padding-right:30px"><a class="jobname" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.name)}</a>${badges}</div>
    <div class="company">${j.co_url?`<a href="${esc(j.co_url)}" target="_blank" rel="noopener">${esc(j.company)}</a>`:esc(j.company)} <span class="ind">${esc(j.industry)}</span></div>
    <div class="salary ${j.salary_class}">${esc(j.salary)}</div>
    ${trafficRow}
    <div class="meta">
      <span class="chip">📍 ${esc(j.area)}</span>
      <span class="chip">${esc(j.period)}</span>
      ${langs}${emp}${co}${vio}
    </div>
    <div class="desc">${esc(j.desc)}</div>
    <div class="row-bottom">
      <span>刊登 ${relDate(j.date)}${j.apply==null?"":`|${j.apply} 人應徵`}</span>
      <a class="apply-btn" href="${esc(j.url)}" target="_blank" rel="noopener">查看職缺 →</a>
    </div>
  </div>`;
}

function render(){
  const q = $("q").value.trim().toLowerCase();
  const maxDrive = parseFloat($("f-drive").value);
  const maxTransit = parseFloat($("f-transit").value);
  const minSalary = parseFloat($("f-salary").value) * 10000;  // 萬 → 元
  const showNeg = $("show-neg").checked;
  let rows = JOBS.filter(j=>{
    if(selDist.size && !selDist.has(j.area)) return false;
    if($("only-new").checked && !j.is_new) return false;
    if(!showNeg && j.salary_class==="negotiable") return false;
    if(!isNaN(maxDrive) && !(j.drive_min!=null && j.drive_min<=maxDrive)) return false;
    if(!isNaN(maxTransit) && !(j.transit_min!=null && j.transit_min<=maxTransit)) return false;
    if(!isNaN(minSalary) && !(j.salary_m>=minSalary)) return false;  // 面議=40001,依法≥4萬
    if(q && !(j.name+j.company+j.desc+j.industry).toLowerCase().includes(q)) return false;
    return true;
  });
  if(VIEW==="fav") rows = rows.filter(j=>FAVS[j.no]);
  const sort = $("sort").value;
  const distOf = j => j.drive_km ?? j.dist_km ?? 9999;
  if(sort==="salary") rows.sort((a,b)=>b.salary_m-a.salary_m);
  else if(sort==="apply") rows.sort((a,b)=>a.apply-b.apply || (a.date<b.date?1:-1));
  else if(sort==="date") rows.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.is_new-a.is_new);
  else rows.sort((a,b)=>(b.pri||0)-(a.pri||0) || distOf(a)-distOf(b));
  let html = rows.map(card).join("");
  if(VIEW==="fav"){
    const gone = Object.values(FAVS).filter(f=>!JOBS.some(j=>j.no===f.no));
    html += gone.map(goneCard).join("");
    $("count").textContent = `收藏中 ${rows.length + gone.length} 筆`;
    if(!html) html = '<div class="empty">還沒有收藏的職缺——點卡片右上角的 ☆ 加到最愛</div>';
  }else{
    $("count").textContent = `符合條件 ${rows.length} 筆`;
    if(!html) html = '<div class="empty">沒有符合條件的職缺</div>';
  }
  $("list").innerHTML = html;
}

// 星星按鈕(事件委派,重繪後仍有效)
$("list").addEventListener("click", e=>{
  const b = e.target.closest(".fav-btn");
  if(b) toggleFav(b.dataset.no);
});
// 頁籤切換
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click", ()=>{
  VIEW = t.dataset.view;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active", x===t));
  render();
}));
saveFavs();

["q","sort","only-new","show-neg","f-drive","f-transit","f-salary"].forEach(id=>{
  $(id).addEventListener("input", render);
});
distLabel();
render();
</script>
</body>
</html>
